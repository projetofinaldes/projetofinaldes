<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar | Motorista Tráfego</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="login">

<!-- Lado esquerdo: título -->
<section class="hero">
    <div class="brand">Motoriata Tráfego</div>
    <div>
    <h1>Nenhuma escala sem motorista.</h1>
    <p>Veja os furos do dia e escale o substituto mais indicado em poucos cliques.</p>
    </div>
</section>

<!-- Lado direito: formulário de login -->
<section class="form">
    <form id="formLogin">
    <h2>Entrar no sistema</h2>

    <label for="matricula">Matrícula</label>
    <input id="matricula" type="text" required>

    <label for="senha">Senha</label>
    <input id="senha" type="password" required>

    <button class="btn" type="submit">Entrar</button>
    </form>
</section>

</div>

<script>
  // Quando clicar em "Entrar", abre o painel.
  // Por enquanto não confere a senha. Isso será feito depois com PHP e MySQL.
document.getElementById('formLogin').addEventListener('submit', function (e) {
    e.preventDefault();
    window.location.href = 'dashboard.html';
});
</script>

</body>
</html>
